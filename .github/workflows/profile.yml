name: profile

on:
  schedule:
    - cron: "*/30 * * * *"   # live stats, time of day and weather
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  build:
    # Only in a profile repository (named exactly like its owner), never in the kit repository itself.
    if: github.event.repository.name == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Draft profile.toml on first run
        if: hashFiles('profile.toml') == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 -m profilekit init --from-github --handle "$OWNER"

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m profilekit build

      - name: Commit README and static graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets profile.toml
          if ! git diff --cached --quiet; then
            git commit -m "profile: rebuild README and graphics"
            git push
          fi

      - name: Publish live graphics to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
